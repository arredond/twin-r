[project]
name = "twin-r-infra"
version = "0.1.0"
description = "twin-r AWS CDK app (S3 data/results buckets, scenario Lambda) -- see docs/decisions/0001-compute-and-iac.md"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.150",
    "constructs>=10.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stacks"]
