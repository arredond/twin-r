[project]
name = "twiner-fragility"
version = "0.1.0"
description = "twiner pipeline: Martins & Silva (2020) fragility functions -> fragility.parquet"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "pyarrow>=17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fragility"]
