[project]
name = "twiner-faults"
version = "0.1.0"
description = "twiner pipeline: QAFI active faults -> faults.parquet"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "geopandas>=1.0",
    "pyarrow>=17.0",
    "shapely>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faults"]
