[project]
name = "twin-r-exposure"
version = "0.1.0"
description = "twin-r pipeline: Catastro buildings -> exposure.parquet + PMTiles"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "geopandas>=1.0",
    "pyarrow>=17.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "duckdb>=1.1",
    "scipy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exposure"]
