[project]
name = "twin-r-tiles"
version = "0.1.0"
description = "twin-r tile-join function: MVT tile + a scenario's thin results -> a joined tile, runnable as a Lambda or locally"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pmtiles>=3.8.1",
    "mapbox-vector-tile>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiles"]
