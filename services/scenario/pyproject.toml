[project]
name = "twin-r-scenario"
version = "0.1.0"
description = "twin-r scenario function: rupture -> GMPE -> damage, runnable as a Lambda or locally"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "openquake.engine>=3.19",
    # Not imported directly by this package, but openquake.hazardlib's
    # gsim.zhao_2016 does `import fiona` unconditionally at module load
    # (it's optional in OpenQuake's own requirements but not guarded with
    # a graceful fallback here) -- dropping it breaks every scenario run,
    # not just GDAL-based fault/exposure parsing (which lives in
    # pipelines/, not here). Confirmed by running the test suite.
    "fiona>=1.9",
    "numpy>=1.26",
    "pyarrow>=17.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pmtiles>=3.8.1",
    "mapbox-vector-tile>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scenario"]
